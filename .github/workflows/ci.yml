# ============================================================
# ConnectSphere — CI Pipeline
#
# Triggers on every push to feature/* and develop branches,
# and on every PR targeting develop or main.
#
# What it does:
#   1. Lint backend
#   2. Lint frontend
#   3. (Future) Run backend tests
#   4. (Future) Run frontend tests
#   5. (Future) Build Docker images
# ============================================================

name: CI

on:
  push:
    branches:
      - "feature/**"
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

