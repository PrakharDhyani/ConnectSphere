# ============================================================
# ConnectSphere/Groot — CI Pipeline
#
# Runs on every PR (and pushes to feature/develop/main):
#   backend  → lint + full test suite (187 tests; they need NO
#              services — mongodb-memory-server + fake Redis)
#   frontend → lint + production build
#
# Mark both jobs as required status checks on the main ruleset
# and untested code physically cannot merge — or deploy, since
# deploy.yml only fires on pushes to main.
# ============================================================

name: CI

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          CI: "true"

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
