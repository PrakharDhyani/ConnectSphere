  <circle cx="47.5" cy="12.5" r="2.2" fill="#f5f3ff" />

  <!-- friendly sprout head (fun) -->
  <circle cx="32" cy="41" r="15" fill="#4ade80" />
  <circle cx="26.5" cy="39" r="2.5" fill="#064e3b" />
  <circle cx="37.5" cy="39" r="2.5" fill="#064e3b" />
